<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гараж — каталог</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#14141a; --surface:#1c1c22; --surface2:#22222a; --line:#2c2c31;
    --cream:#f0e9db; --muted:#9a988f; --blue:#4a90d9; --red:#c43c3a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--cream);
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;}
  body{padding-bottom:env(safe-area-inset-bottom,0);}
  header{position:sticky;top:0;z-index:5;background:var(--bg);
    padding:calc(16px + env(safe-area-inset-top,0)) 18px 10px;border-bottom:1px solid var(--line);}
  h1{margin:0 0 4px;font-size:22px;letter-spacing:.5px;}
  .note{margin:0;color:var(--muted);font-size:13px;}
  nav{display:flex;gap:8px;overflow-x:auto;padding:12px 18px;scrollbar-width:none;}
  nav::-webkit-scrollbar{display:none;}
  .tab{flex:none;padding:8px 14px;border-radius:20px;background:var(--surface);
    color:var(--muted);font-size:14px;border:1px solid var(--line);white-space:nowrap;}
  .tab.active{background:var(--cream);color:var(--bg);border-color:var(--cream);font-weight:600;}
  main{padding:4px 18px 100px;}
  .card{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:14px;margin-bottom:12px;align-items:flex-start;}
  .icon{flex:none;width:52px;height:52px;border-radius:10px;background:var(--surface2);
    display:flex;align-items:center;justify-content:center;}
  .icon svg{width:28px;height:28px;stroke:var(--blue);fill:none;stroke-width:1.6;}
  .body{flex:1;min-width:0;}
  .name{font-size:15px;font-weight:600;margin:0 0 3px;}
  .desc{font-size:13px;color:var(--muted);margin:0 0 8px;line-height:1.4;}
  .badge{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--line);
    border-radius:6px;padding:2px 7px;margin-bottom:8px;}
  .pick{border:1px solid var(--line);background:transparent;color:var(--cream);
    font-size:13px;padding:7px 12px;border-radius:9px;width:100%;}
  .pick.on{background:var(--blue);border-color:var(--blue);color:#0d0d10;font-weight:600;}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);}
  .empty svg{width:40px;height:40px;stroke:var(--muted);fill:none;stroke-width:1.4;margin-bottom:10px;}
  .bar{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0));
    background:linear-gradient(180deg,transparent,var(--bg) 30%);
    transform:translateY(120%);transition:transform .2s ease;}
  .bar.show{transform:translateY(0);}
  .bar button{width:100%;border:none;border-radius:12px;background:var(--cream);color:var(--bg);
    font-size:15px;font-weight:700;padding:14px;}
</style>
</head>
<body>

<header>
  <h1>Гараж</h1>
  <p class="note">Всё под заказ · сроки 3–14 дней · цену подтвердим после заявки</p>
</header>

<nav id="tabs"></nav>
<main id="list"></main>
<div class="bar" id="bar"><button id="sendBtn">Отправить заявку</button></div>

<script>
const ICONS = {
  plug: '<svg viewBox="0 0 24 24"><path d="M9 2v6M15 2v6M6 8h12l-1 6a5 5 0 0 1-10 0L6 8Z"/><path d="M12 18v4"/></svg>',
  scan: '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h6M7 14h10"/></svg>',
  spray: '<svg viewBox="0 0 24 24"><path d="M8 3h4l1 3H7l1-3Z"/><path d="M9 6v3H7a2 2 0 0 0-2 2v9h8v-9a2 2 0 0 0-2-2h-2"/><path d="M16 8h3M16 11h4M16 14h3"/></svg>',
  tire: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.4"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>',
  empty: '<svg viewBox="0 0 24 24"><path d="M4 7h16l-1.5 12h-13L4 7Z"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/></svg>'
};

const CATEGORIES = [
  {
    id: "diag", label: "Диагностика",
    items: [
      { id:"carplay", icon:"plug", name:"Адаптер CarPlay",
        desc:"Беспроводной CarPlay / Android Auto." },
      { id:"elm327_basic", icon:"scan", name:"OBD-сканер ELM327",
        desc:"Диагностика неисправностей через телефон." },
      { id:"elm327_wifi", icon:"scan", name:"Автосканер ELM327 Wi-Fi OBD2",
        desc:"Версия 1.5 (PIC18F25K80), для iPhone и Android." },
    ]
  },
  { id:"chem", label:"Автохимия", items:[
      { id:"superstar", icon:"spray", name:"Shine Systems SuperStar",
        desc:"Активный шампунь для 1-й фазы (бесконтактная мойка). Самый мощный по отмыванию в линейке." },
      { id:"cationic", icon:"spray", name:"Shine Systems CationicShampoo",
        desc:"Катионный шампунь для 2-й фазы (ручная мойка). Гидрофобный эффект и блеск после смывки — один из самых спрашиваемых." },
      { id:"bitumoff", icon:"spray", name:"Shine Systems BitumOFF",
        desc:"Терпеновый антибитум. Убирает битумные пятна, смолу и следы насекомых с кузова." },
      { id:"ironoff", icon:"tire", name:"Shine Systems IronOFF",
        desc:"Бескислотный очиститель дисков с индикатором — краснеет при реакции с металлической пылью. Часто берут вместе с BitumOFF." },
      { id:"glossprotection", icon:"spray", name:"Shine Systems GlossProtection",
        desc:"Наноконсервант для 3-й фазы — быстрая сушка, блеск и лёгкий гидрофоб." },
      { id:"quickdetailer", icon:"spray", name:"Shine Systems QuickDetailer",
        desc:"Спрей быстрого блеска между полными мойками." },
  ] },
  { id:"tires", label:"Шины", items:[] },
];

let active = CATEGORIES[0].id;
const selected = new Map();

function renderTabs(){
  document.getElementById("tabs").innerHTML = CATEGORIES.map(c =>
    `<button class="tab${c.id===active?" active":""}" data-cat="${c.id}">${c.label}</button>`
  ).join("");
}

function renderList(){
  const cat = CATEGORIES.find(c => c.id === active);
  const list = document.getElementById("list");
  if(!cat.items.length){
    list.innerHTML = `<div class="empty">${ICONS.empty}<div>Пока пусто — уже подбираем поставщиков для этой категории.</div></div>`;
    return;
  }
  list.innerHTML = cat.items.map(it => `
    <div class="card">
      <div class="icon">${ICONS[it.icon]}</div>
      <div class="body">
        <p class="name">${it.name}</p>
        <p class="desc">${it.desc}</p>
        <div class="badge">Под заказ · 3–14 дней</div>
        <button class="pick${selected.has(it.id)?" on":""}" data-id="${it.id}" data-name="${it.name}">
          ${selected.has(it.id) ? "✓ В заявке" : "+ В заявку"}
        </button>
      </div>
    </div>
  `).join("");
}

function renderBar(){
  const n = selected.size;
  const bar = document.getElementById("bar");
  bar.classList.toggle("show", n > 0);
  document.getElementById("sendBtn").textContent =
    n > 0 ? `Отправить заявку (${n})` : "Отправить заявку";
}

document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab");
  if(!b) return;
  active = b.dataset.cat;
  renderTabs(); renderList();
});

document.getElementById("list").addEventListener("click", e => {
  const b = e.target.closest(".pick");
  if(!b) return;
  const id = b.dataset.id, name = b.dataset.name;
  if(selected.has(id)) selected.delete(id); else selected.set(id, name);
  renderList(); renderBar();
});

document.getElementById("sendBtn").addEventListener("click", () => {
  if(!selected.size) return;
  const items = [...selected.entries()].map(([id, name]) => ({ id, name }));
  const payload = JSON.stringify({ items });
  if(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.sendData){
    window.Telegram.WebApp.sendData(payload);
    window.Telegram.WebApp.close();
  } else {
    alert("Открой этот каталог через кнопку в боте, чтобы отправить заявку:\n\n" +
      items.map(i => "• " + i.name).join("\n"));
  }
});

if(window.Telegram && window.Telegram.WebApp){
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}

renderTabs();
renderList();
renderBar();
</script>
</body>
</html>
