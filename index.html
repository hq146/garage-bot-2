<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гараж — каталог</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto+Slab:wght@600;800&family=Russo+One&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0a0a0c; --card:#18181b; --card2:#222226; --line:#2a2a2f;
    --text:#f4f1ea; --muted:#8d8b85; --accent:#ff7a3d; --blue:#5aa2ff; --green:#4cc38a;
    --side:max(14px, calc(50% - 266px));
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--text);min-height:100%;
    font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;}
  body{padding:calc(12px + env(safe-area-inset-top,0)) 14px calc(180px + env(safe-area-inset-bottom,0));max-width:560px;margin:0 auto;}
  button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;}
  svg{display:block;}

  .hero{position:relative;overflow:hidden;border-radius:28px;min-height:196px;padding:18px;display:flex;flex-direction:column;
    background:radial-gradient(circle at 85% 15%, rgba(255,122,61,.45), transparent 55%),
               radial-gradient(circle at 5% 100%, rgba(90,162,255,.30), transparent 55%), #141417;}
  .hero.plain{background:linear-gradient(160deg,#232327,#141417 70%);}
  .hero .door{position:absolute;right:-18px;bottom:-14px;width:190px;opacity:.13;stroke:var(--text);fill:none;stroke-width:3;}
  .hero.plain .door{right:14px;bottom:18px;width:96px;opacity:.28;}
  .hero-top{display:flex;justify-content:space-between;align-items:center;position:relative;}
  .brand{font-size:17px;font-weight:700;letter-spacing:.3px;}
  .pillchip{font-size:13px;color:var(--muted);background:rgba(255,255,255,.08);padding:6px 12px;border-radius:999px;}
  .round{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;}
  .round svg{width:18px;height:18px;stroke:var(--text);fill:none;stroke-width:1.8;}
  .hero-bottom{margin-top:auto;position:relative;}
  .label{font-size:12px;font-weight:700;letter-spacing:1.2px;color:rgba(244,241,234,.65);text-transform:uppercase;}
  .count{display:flex;align-items:center;gap:10px;margin-top:4px;}
  .count b{font-size:44px;line-height:1;font-weight:800;}
  .count span{font-size:18px;color:rgba(244,241,234,.6);font-weight:600;}
  .hero-note{font-size:12px;color:rgba(244,241,234,.6);margin-top:8px;}

  .chips{display:flex;gap:8px;overflow-x:auto;margin:14px -14px 12px;padding:0 14px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:none;padding:9px 15px;border-radius:999px;background:var(--card);color:var(--muted);font-size:14px;font-weight:600;white-space:nowrap;}
  .chip.active{background:var(--text);color:var(--bg);}

  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
  .tile{position:relative;background:var(--card);border-radius:24px;padding:16px 14px 14px;min-height:172px;
    display:flex;flex-direction:column;text-align:left;border:1.5px solid transparent;transition:transform .12s ease,border-color .15s ease;}
  .tile:active{transform:scale(.97);}
  .tile.on{border-color:var(--accent);}
  .ico{flex:none;width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;}
  .ico svg{width:26px;height:26px;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .add{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;}
  .add svg{width:16px;height:16px;stroke:var(--text);fill:none;stroke-width:2.2;}
  .tile.on .add{background:var(--accent);}
  .tile.on .add svg{stroke:#140a05;}
  .name{font-size:15px;font-weight:700;line-height:1.25;margin-top:14px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .meta{margin-top:auto;padding-top:12px;}
  .meta-row{display:flex;justify-content:space-between;align-items:baseline;}
  .meta-row .st{font-size:14px;font-weight:700;}
  .meta-row .d{font-size:11px;color:var(--muted);}
  .bar{height:3px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden;}
  .bar i{display:block;height:100%;width:28%;background:var(--muted);border-radius:2px;transition:width .25s ease,background .25s ease;}
  .tile.on .bar i{width:100%;background:var(--accent);}
  .empty{grid-column:1/-1;background:var(--card);border-radius:24px;padding:34px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5;}

  /* history */
  .month{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:18px 4px 8px;}
  .month b{font-weight:600;color:#b9b6ae;}
  .hrow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:22px;padding:14px;margin-bottom:8px;}
  .hrow .body{flex:1;min-width:0;}
  .hrow .t{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hrow .t small{color:var(--muted);font-weight:600;font-size:13px;}
  .tags{display:flex;gap:6px;align-items:center;margin-top:6px;}
  .tags .tg{font-size:12px;color:#c9c6bf;background:var(--card2);padding:3px 8px;border-radius:7px;}
  .tags .num{font-size:12px;color:var(--muted);}
  .status{flex:none;font-size:13px;font-weight:700;padding:6px 10px;border-radius:10px;}
  .s-n{color:var(--accent);background:rgba(255,122,61,.12);}
  .s-d{color:var(--green);background:rgba(76,195,138,.12);}
  .s-c{color:var(--muted);background:var(--card2);}
  .hint{text-align:center;color:var(--muted);font-size:12px;margin-top:12px;line-height:1.4;}
  .ghost{display:block;margin:14px auto 0;padding:11px 18px;border-radius:14px;background:var(--card2);font-size:14px;font-weight:700;}

  h2{font-size:24px;font-weight:800;margin:6px 2px 14px;}
  .info{background:var(--card);border-radius:22px;padding:16px;margin-bottom:10px;}
  .info h3{font-size:15px;font-weight:800;margin-bottom:8px;}
  .info p{font-size:14px;color:#c9c6bf;line-height:1.55;}
  .footer{text-align:center;color:var(--muted);font-size:13px;margin-top:22px;}

  /* VIN promo tile */
  .vinpromo{display:flex;align-items:center;gap:14px;width:100%;margin-top:10px;background:var(--card);border-radius:24px;padding:16px;text-align:left;}
  .vinpromo:active{transform:scale(.98);}
  .vinpromo .body{flex:1;}
  .vinpromo b{display:block;font-size:16px;font-weight:800;}
  .vinpromo span{font-size:13px;color:var(--muted);}
  .vinpromo .free{flex:none;font-size:12px;font-weight:800;color:var(--green);background:rgba(76,195,138,.12);padding:6px 10px;border-radius:10px;}

  /* VIN view */
  .topbar{display:flex;align-items:center;gap:12px;margin:2px 0 14px;}
  .topbar .back{width:40px;height:40px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;}
  .topbar .back svg{width:18px;height:18px;stroke:var(--text);fill:none;stroke-width:2;}
  .topbar h2{margin:0;}
  .steps{display:flex;gap:8px;margin-top:16px;position:relative;}
  .steps div{flex:1;background:rgba(255,255,255,.07);border-radius:14px;padding:10px;font-size:12px;color:#c9c6bf;line-height:1.35;}
  .steps b{display:block;font-size:18px;color:var(--text);margin-bottom:2px;}
  .form{background:var(--card);border-radius:24px;padding:16px;margin-top:10px;}
  .flabel{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:700;letter-spacing:1px;
    text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  .flabel .cnt{letter-spacing:0;font-size:13px;}
  .flabel .cnt.ok{color:var(--green);}
  .vin{width:100%;background:var(--card2);border:1.5px solid transparent;border-radius:16px;padding:15px 14px;color:var(--text);
    font:700 19px/1.2 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:2px;text-transform:uppercase;outline:none;}
  .vin:focus{border-color:var(--line);}
  .vin.ok{border-color:var(--green);}
  .vin.bad{border-color:#e5484d;}
  .err{min-height:18px;font-size:13px;color:#e5484d;margin-top:6px;}
  .help{margin-top:2px;font-size:13px;color:var(--blue);font-weight:600;}
  .helpbox{display:none;margin-top:10px;background:var(--card2);border-radius:14px;padding:12px;font-size:13px;color:#c9c6bf;line-height:1.55;}
  .helpbox.show{display:block;}
  .part{width:100%;min-height:84px;resize:none;background:var(--card2);border:1.5px solid transparent;border-radius:16px;padding:13px 14px;
    color:var(--text);font:500 16px/1.4 inherit;font-family:inherit;outline:none;}
  .part:focus{border-color:var(--line);}
  .quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .quick button{font-size:13px;font-weight:600;color:#c9c6bf;background:var(--card2);padding:7px 11px;border-radius:999px;}
  .primary:disabled{opacity:.35;}


  /* ================== ТЕМЫ МАГАЗИНА ================== */
  .hero,.brand,h2,.name,.count b,.vinpromo b,.sheet h4,.primary,.cartbar{font-family:var(--head);}


  /* 0. ФИРМЕННАЯ «ГАРАЖ» — цвета логотипа: графит #1a1d21 + крем #ece8dc, узкий шрифт, двойное кольцо */
  body[data-theme="garage"]{--bg:#121417;--card:#1b1e22;--card2:#262a2f;--line:#31363c;--text:#ece8dc;--muted:#8f8b80;
    --accent:#ece8dc;--on-accent:#1a1d21;--green:#9fcfae;--head:"Oswald","DejaVu Sans Condensed","Arial Narrow",sans-serif;}
  [data-theme="garage"] .hero,[data-theme="garage"] .hero.plain{background:#1a1d21;
    box-shadow:inset 0 0 0 1.5px rgba(236,232,220,.85), inset 0 0 0 7px #1a1d21, inset 0 0 0 8.5px rgba(236,232,220,.3);}
  [data-theme="garage"] .hero .logo{position:absolute;right:16px;bottom:16px;width:112px;height:112px;}
  [data-theme="garage"] .hero .door{display:none;}
  [data-theme="garage"] .hero-bottom{max-width:calc(100% - 122px);}
  [data-theme="garage"] .brand{text-transform:uppercase;letter-spacing:3px;font-size:19px;}
  [data-theme="garage"] .brand::before{content:"– ";opacity:.6;}
  [data-theme="garage"] .brand::after{content:" –";opacity:.6;}
  [data-theme="garage"] .count b{font-size:54px;font-weight:700;}
  [data-theme="garage"] .name,[data-theme="garage"] .chip,[data-theme="garage"] .label,[data-theme="garage"] .flabel,
  [data-theme="garage"] .cartbar,[data-theme="garage"] .primary,[data-theme="garage"] h2,[data-theme="garage"] .vinpromo b{
    font-family:var(--head);text-transform:uppercase;letter-spacing:.8px;}
  [data-theme="garage"] .name{font-weight:600;font-size:16px;letter-spacing:.4px;}
  [data-theme="garage"] .chip{border:1px solid var(--line);}
  [data-theme="garage"] .ico{background:var(--card2)!important;}
  [data-theme="garage"] .ico svg{stroke:var(--text)!important;}
  [data-theme="garage"] .tile.on{border-color:var(--text);}
  [data-theme="garage"] .vinpromo .free{color:var(--text);background:transparent;border:1px solid rgba(236,232,220,.5);}
  [data-theme="garage"] .s-n{color:var(--text);background:transparent;border:1px solid rgba(236,232,220,.45);}
  [data-theme="garage"] .pill,[data-theme="garage"] .solo{background:#1a1d21;box-shadow:inset 0 0 0 1px rgba(236,232,220,.16);}
  [data-theme="garage"] .pill button.active{background:rgba(236,232,220,.1);}
  [data-theme="garage"] .cartbar{box-shadow:0 0 0 4px var(--bg),0 12px 30px rgba(0,0,0,.6);}
  [data-theme="garage"] .help{color:var(--text);text-decoration:underline;text-underline-offset:3px;}
  html,body{overflow-x:hidden;}

  /* 1. МАСТЕРСКАЯ — графит + сигнальный жёлтый, как разметка в автосервисе */
  body[data-theme="workshop"]{--bg:#111111;--card:#1c1c1c;--card2:#292929;--line:#343434;--text:#f2f2f2;--muted:#999;
    --accent:#ffc629;--on-accent:#111;--head:"Oswald","DejaVu Sans Condensed","Arial Narrow",sans-serif;}
  [data-theme="workshop"] .hero{border-radius:16px;background:#1c1c1c;padding-bottom:34px;}
  [data-theme="workshop"] .hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16px;
    background:repeating-linear-gradient(-45deg,#ffc629 0 14px,#111 14px 28px);}
  [data-theme="workshop"] .hero .door{opacity:.09;}
  [data-theme="workshop"] .brand{text-transform:uppercase;letter-spacing:3px;font-size:20px;color:var(--accent);}
  [data-theme="workshop"] .count b{font-size:52px;}
  [data-theme="workshop"] .tile,[data-theme="workshop"] .vinpromo,[data-theme="workshop"] .form,[data-theme="workshop"] .hrow,
  [data-theme="workshop"] .info,[data-theme="workshop"] .empty{border-radius:14px;}
  [data-theme="workshop"] .name{text-transform:uppercase;letter-spacing:.4px;font-size:15px;}
  [data-theme="workshop"] .chip{border-radius:8px;text-transform:uppercase;font-size:13px;letter-spacing:.6px;}
  [data-theme="workshop"] .ico{border-radius:10px;}
  [data-theme="workshop"] .pill,[data-theme="workshop"] .solo{border-radius:16px;}
  [data-theme="workshop"] .pill button{border-radius:12px;}
  [data-theme="workshop"] .cartbar,[data-theme="workshop"] .primary{border-radius:12px;text-transform:uppercase;letter-spacing:1px;}

  /* 2. РЕТРО-ГАРАЖ — светлая тема, кремовый + тёмно-зелёный, как эмалированная вывеска */
  body[data-theme="retro"]{--bg:#efe7d8;--card:#fbf6ec;--card2:#e8dcc6;--line:#d6c8ae;--text:#1f2a24;--muted:#7a7262;
    --accent:#c4472c;--on-accent:#fff;--green:#2f6b4f;--head:"Roboto Slab","DejaVu Serif",Georgia,serif;}
  [data-theme="retro"] .hero,[data-theme="retro"] .hero.plain{background:#1f3d2f;color:#efe7d8;
    box-shadow:inset 0 0 0 7px #1f3d2f, inset 0 0 0 9px #c9b88f;}
  [data-theme="retro"] .hero .door{stroke:#efe7d8;}
  [data-theme="retro"] .hero .round svg{stroke:#efe7d8;}
  [data-theme="retro"] .pillchip{color:#efe7d8;}
  [data-theme="retro"] .brand{font-size:21px;}
  [data-theme="retro"] .tile,[data-theme="retro"] .vinpromo,[data-theme="retro"] .form,[data-theme="retro"] .hrow,
  [data-theme="retro"] .info,[data-theme="retro"] .empty,[data-theme="retro"] .row{box-shadow:0 1px 0 var(--line),0 6px 18px rgba(60,45,20,.06);}
  [data-theme="retro"] .chip{border:1px solid var(--line);}
  [data-theme="retro"] .chip.active{background:#1f3d2f;color:#efe7d8;border-color:#1f3d2f;}
  [data-theme="retro"] .primary{background:#1f3d2f;color:#efe7d8;}
  [data-theme="retro"] .month b,[data-theme="retro"] .tags .tg,[data-theme="retro"] .info p,[data-theme="retro"] .sheet p,
  [data-theme="retro"] .helpbox,[data-theme="retro"] .quick button{color:var(--text);}
  [data-theme="retro"] .sheet{background:var(--card);}
  [data-theme="retro"] .pill,[data-theme="retro"] .solo{background:#1f3d2f;}
  [data-theme="retro"] .pill svg,[data-theme="retro"] .solo svg{stroke:rgba(239,231,216,.55);}
  [data-theme="retro"] .pill button.active{background:rgba(239,231,216,.14);}
  [data-theme="retro"] .pill button.active svg{stroke:#efe7d8;}

  /* 3. ГОНОЧНЫЙ — чёрный + гоночный красный, клетчатый флаг и наклонные заголовки */
  body[data-theme="racing"]{--bg:#0b0b0b;--card:#161616;--card2:#232323;--line:#2e2e2e;--text:#fff;--muted:#8a8a8a;
    --accent:#e10600;--on-accent:#fff;--head:"Russo One","DejaVu Sans",sans-serif;}
  [data-theme="racing"] .hero,[data-theme="racing"] .hero.plain{background:
      linear-gradient(115deg,transparent 58%,#e10600 58% 61%,transparent 61% 64%,#e10600 64% 65%,transparent 65%),
      #141414;}
  [data-theme="racing"] .hero::after{content:"";position:absolute;right:0;top:0;width:150px;height:100%;opacity:.16;
    background:conic-gradient(#fff 25%,transparent 0 50%,#fff 0 75%,transparent 0) 0 0/24px 24px;
    -webkit-mask:linear-gradient(90deg,transparent,#000);mask:linear-gradient(90deg,transparent,#000);}
  [data-theme="racing"] .hero .door{display:none;}
  [data-theme="racing"] .brand,[data-theme="racing"] .count b,[data-theme="racing"] .name,[data-theme="racing"] h2,
  [data-theme="racing"] .vinpromo b,[data-theme="racing"] .cartbar,[data-theme="racing"] .primary{font-style:italic;}
  [data-theme="racing"] .brand{text-transform:uppercase;letter-spacing:2px;font-size:20px;}
  [data-theme="racing"] .tile{border-radius:18px;border-left:4px solid var(--card2);}
  [data-theme="racing"] .tile.on{border-color:var(--accent);border-left-color:var(--accent);}
  [data-theme="racing"] .chip.active{background:var(--accent);color:#fff;}

  /* общие правки под тему */
  body .cartbar,body .badge{color:var(--on-accent);}
  .tile.on .add svg{stroke:var(--on-accent);}

  /* ====== ЖИВОЙ КАТАЛОГ ====== */
  /* заставка: поднимаются гаражные ворота */
  #intro{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    background:repeating-linear-gradient(180deg,#1a1d21 0 34px,#2a2e34 34px 37px);
    transition:transform .85s cubic-bezier(.75,0,.25,1);}
  #intro img{width:150px;height:150px;transition:transform .5s ease;}
  #intro.up{transform:translateY(-100%);}
  #intro.up img{transform:scale(.85);}

  /* бегущая строка */
  .ticker{margin:12px -14px 0;overflow:hidden;white-space:nowrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;}
  .ticker div{display:inline-block;animation:tick 26s linear infinite;font:600 13px/1 var(--head);letter-spacing:2.2px;text-transform:uppercase;color:var(--muted);}
  .ticker i{font-style:normal;color:var(--text);margin:0 14px;}
  @keyframes tick{to{transform:translateX(-50%);}}

  .section{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 10px;}
  .section b{font:700 18px var(--head);text-transform:uppercase;letter-spacing:1.2px;}
  .section span{font-size:12px;color:var(--muted);}

  /* плитка-хит */
  .feat{grid-column:1/-1;position:relative;overflow:hidden;min-height:178px;border-radius:24px;padding:18px;
    background:var(--text);color:var(--bg);display:flex;flex-direction:column;text-align:left;}
  .feat .hit{align-self:flex-start;font:700 11px/1 var(--head);letter-spacing:1.6px;background:var(--bg);color:var(--text);padding:6px 9px;border-radius:7px;}
  .feat .fname{font:700 23px/1.08 var(--head);text-transform:uppercase;letter-spacing:.5px;margin-top:12px;max-width:64%;}
  .feat .fdesc{font-size:13px;line-height:1.35;opacity:.72;margin-top:6px;max-width:62%;}
  .feat .art{position:absolute;right:-14px;bottom:-18px;width:168px;height:168px;fill:none;stroke:var(--bg);stroke-width:1.15;
    stroke-linecap:round;stroke-linejoin:round;transform:rotate(-12deg);opacity:.9;pointer-events:none;}
  .feat .fbtn{align-self:flex-start;margin-top:auto;position:relative;padding:11px 16px;border-radius:999px;background:var(--bg);color:var(--text);
    font:700 14px/1 var(--head);text-transform:uppercase;letter-spacing:1px;}
  .feat.on .fbtn{background:transparent;color:var(--bg);box-shadow:inset 0 0 0 1.5px var(--bg);}
  .feat .fwrap{margin-top:14px;}

  /* обычная плитка: номер + контурный рисунок */
  .tile{overflow:hidden;}
  .tile .no{font:700 13px/1 var(--head);letter-spacing:1.6px;color:var(--muted);margin-top:4px;}
  .tile .wm{position:absolute;right:-22px;bottom:34px;width:118px;height:118px;fill:none;stroke:var(--text);stroke-width:1.1;
    stroke-linecap:round;stroke-linejoin:round;opacity:.08;transform:rotate(-12deg);pointer-events:none;transition:opacity .2s;}
  .tile.on .wm{opacity:.18;}
  .tile .name{margin-top:12px;position:relative;}

  /* комплект-купон */
  .bundle{grid-column:1/-1;position:relative;display:flex;align-items:center;gap:14px;background:var(--card);
    border:1.5px dashed rgba(143,139,128,.55);border-radius:22px;padding:16px 18px;}
  .bundle::before,.bundle::after{content:"";position:absolute;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:50%;background:var(--bg);}
  .bundle::before{left:-11px;} .bundle::after{right:-11px;}
  .bundle .pair{flex:none;display:flex;align-items:center;gap:4px;}
  .bundle .pair svg{width:30px;height:30px;fill:none;stroke:var(--text);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
  .bundle .pair em{font-style:normal;color:var(--muted);font-weight:700;}
  .bundle .bt{flex:1;min-width:0;}
  .bundle .bt small{display:block;font:700 11px/1 var(--head);letter-spacing:1.6px;color:var(--muted);text-transform:uppercase;}
  .bundle .bt b{display:block;font:700 16px/1.15 var(--head);text-transform:uppercase;margin-top:5px;}
  .bundle .bt span{display:block;font-size:12px;color:var(--muted);margin-top:4px;line-height:1.3;}
  .bundle .bbtn{flex:none;padding:10px 12px;border-radius:12px;background:var(--text);color:var(--bg);font:700 12px/1.1 var(--head);text-transform:uppercase;letter-spacing:.6px;}
  .bundle.on .bbtn{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--text);}

  /* фото товаров: белый фон снимка «растворяется» в кремовой подложке (multiply) */
  .tile .ph{position:relative;height:120px;margin-top:12px;border-radius:16px;background:#ece8dc;
    display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .tile .ph img{max-width:86%;max-height:88%;object-fit:contain;mix-blend-mode:multiply;}
  .tile .ph + .name{margin-top:10px;}
  .feat .fphoto{position:absolute;right:10px;bottom:14px;width:38%;max-height:82%;object-fit:contain;mix-blend-mode:multiply;pointer-events:none;}
  .sph{height:220px;border-radius:20px;background:#ece8dc;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .sph img{max-height:90%;max-width:80%;object-fit:contain;mix-blend-mode:multiply;}

  /* ===== ШИНЫ ===== */
  .tfilters{margin:0 0 4px;}
  .seg{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px;}
  .seg button{flex:1;padding:10px 6px;border-radius:10px;font:600 14px/1 var(--head);text-transform:uppercase;letter-spacing:.8px;color:var(--muted);}
  .seg button.on{background:var(--text);color:var(--bg);}
  .rims{display:flex;gap:6px;overflow-x:auto;margin:10px -14px 0;padding:0 14px;scrollbar-width:none;}
  .rims::-webkit-scrollbar{display:none;}
  .rims button{flex:none;min-width:52px;padding:9px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line);
    font:700 14px/1 var(--head);color:var(--muted);}
  .rims button.on{background:var(--text);border-color:var(--text);color:var(--bg);}
  .tsearch{display:flex;align-items:center;gap:10px;margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;}
  .tsearch svg{width:18px;height:18px;flex:none;stroke:var(--muted);fill:none;stroke-width:2;}
  .tsearch input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text);font:500 15px/1 inherit;font-family:inherit;padding:13px 0;}
  .brand-t{position:relative;overflow:hidden;background:var(--card);border-radius:20px;padding:15px 14px 13px;min-height:128px;
    display:flex;flex-direction:column;text-align:left;border:1.5px solid transparent;}
  .brand-t:active{transform:scale(.97);}
  .brand-t.on{border-color:var(--text);}
  .brand-t .bn{font:700 21px/1.05 var(--head);text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:22px;}
  .brand-t .bn.l{font-size:17px;} .brand-t .bn.xl{font-size:14px;}
  .brand-t .bm{font-size:12px;color:var(--muted);margin-top:6px;}
  .brand-t .br{margin-top:auto;padding-top:10px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 10px;font:600 13px/1 var(--head);letter-spacing:.6px;}
  .brand-t .ss{color:var(--muted);text-transform:uppercase;font-size:11px;}
  .brand-t .wheel{position:absolute;right:-26px;top:-26px;width:96px;height:96px;fill:none;stroke:var(--text);stroke-width:1;opacity:.07;}
  .brand-t .cnt{position:absolute;top:12px;right:12px;min-width:22px;height:22px;border-radius:11px;padding:0 6px;background:var(--text);color:var(--bg);
    font:800 12px/22px var(--head);text-align:center;}
  .more{grid-column:1/-1;padding:13px;border-radius:14px;background:var(--card);font:700 14px var(--head);text-transform:uppercase;letter-spacing:.8px;}

  /* «не нашли шины» */
  .notfound{grid-column:1/-1;display:flex;align-items:center;gap:14px;text-align:left;border-radius:20px;padding:16px;
    background:var(--card);border:1.5px dashed rgba(143,139,128,.55);}
  .notfound svg{flex:none;width:40px;height:40px;fill:none;stroke:var(--text);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;}
  .notfound .t{flex:1;min-width:0;}
  .notfound b{display:block;font:700 16px/1.15 var(--head);text-transform:uppercase;letter-spacing:.5px;}
  .notfound span{display:block;font-size:13px;color:var(--muted);margin-top:4px;line-height:1.35;}
  .notfound i{flex:none;font-style:normal;font:700 22px/1 var(--head);}
  .askother{display:block;width:100%;margin-top:12px;padding:12px;border-radius:14px;border:1px dashed var(--line);color:var(--muted);font-size:14px;}
  .finput{width:100%;background:var(--card2);border:1.5px solid transparent;border-radius:16px;padding:14px;color:var(--text);
    font:600 17px/1.2 inherit;font-family:inherit;outline:none;}
  .finput:focus{border-color:var(--line);}
  .finput.big{font:700 20px/1.2 var(--head);letter-spacing:1px;}
  .finput.ok{border-color:var(--green);}
  .fhint{font-size:12px;color:var(--muted);margin-top:6px;}
  .seg.wrap{flex-wrap:wrap;}
  .seg.wrap button{flex:1 1 40%;}
  .qty{display:flex;align-items:center;gap:14px;}
  .qty button{width:46px;height:46px;border-radius:14px;background:var(--card2);font:700 22px/1 var(--head);}
  .qty b{min-width:60px;text-align:center;font:700 26px/1 var(--head);}
  .qty span{color:var(--muted);font-size:14px;}

  /* карточка марки */
  .sheet .shead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .sheet .shead h4{margin:4px 0 2px;font:700 26px/1.05 var(--head);text-transform:uppercase;letter-spacing:.6px;}
  .sheet .shead span{font-size:12px;color:var(--muted);white-space:nowrap;}
  .fnote{font-size:12px;color:var(--muted);margin:4px 0 6px;}
  .mdl{background:var(--card);border-radius:18px;padding:14px;margin-top:10px;}
  .mdl .mt{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .mdl .mt b{font:700 16px/1.15 var(--head);text-transform:uppercase;letter-spacing:.4px;}
  .mdl .se{flex:none;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:4px 7px;}
  .rrow{display:flex;gap:10px;align-items:flex-start;margin-top:10px;}
  .rrow .rl{flex:none;width:42px;font:700 14px/30px var(--head);color:var(--muted);}
  .rrow .zs{display:flex;flex-wrap:wrap;gap:6px;}
  .zs button{padding:7px 10px;border-radius:9px;background:var(--card2);font:600 13px/16px var(--head);letter-spacing:.3px;color:var(--text);}
  .zs button small{font-size:10px;color:var(--muted);margin-left:4px;text-transform:uppercase;}
  .zs button.on{background:var(--text);color:var(--bg);}
  .zs button.on small{color:var(--bg);opacity:.7;}
  .sfoot{position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom,0));margin:14px -18px calc(-22px - env(safe-area-inset-bottom,0));
    padding:12px 18px calc(16px + env(safe-area-inset-bottom,0));background:linear-gradient(180deg,transparent,var(--card) 30%);}
  .sfoot .primary{margin-top:0;}
  .tempty{grid-column:1/-1;}

  /* микро-анимации */
  @keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.28);}100%{transform:scale(1);}}
  .pop{animation:pop .32s ease;}
  @media (prefers-reduced-motion:reduce){ .ticker div{animation:none;} .pop{animation:none;} #intro{display:none;} }

  /* sheet */
  .shade{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;}
  .shade.show{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:max(0px, calc(50% - 280px));right:max(0px, calc(50% - 280px));bottom:0;z-index:21;background:#161619;border-radius:28px 28px 0 0;max-height:85vh;overflow-y:auto;
    padding:10px 18px calc(22px + env(safe-area-inset-bottom,0));transform:translateY(105%);transition:transform .25s ease;}
  .sheet.show{transform:translateY(0);}
  .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px;}
  .sheet .big{width:56px;height:56px;border-radius:18px;}
  .sheet .big svg{width:32px;height:32px;}
  .sheet h4{font-size:20px;font-weight:800;margin:14px 0 8px;line-height:1.25;}
  .sheet p{font-size:15px;color:#c9c6bf;line-height:1.5;}
  .tag{display:inline-block;margin-top:12px;font-size:12px;color:var(--muted);background:var(--card2);padding:5px 10px;border-radius:8px;}
  .row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:12px;margin-bottom:8px;}
  .row .t{flex:1;font-size:15px;font-weight:600;line-height:1.3;}
  .row .x{width:32px;height:32px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;}
  .row .x svg{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2.4;}
  .primary{width:100%;margin-top:12px;padding:16px;border-radius:18px;background:var(--text);color:var(--bg);font-size:16px;font-weight:800;}

  /* floating cart bar */
  .cartbar{position:fixed;left:var(--side);right:var(--side);bottom:calc(92px + env(safe-area-inset-bottom,0));z-index:9;
    display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-radius:20px;
    background:var(--accent);color:#140a05;font-weight:800;font-size:15px;
    opacity:0;visibility:hidden;pointer-events:none;transform:translateY(16px);
    transition:transform .2s ease,opacity .2s ease,visibility .2s;}
  .cartbar.show{opacity:1;visibility:visible;pointer-events:auto;transform:none;}

  .nav{position:fixed;left:var(--side);right:var(--side);bottom:calc(14px + env(safe-area-inset-bottom,0));display:flex;gap:10px;z-index:10;}
  .pill{flex:1;display:flex;background:#1c1c20;border-radius:999px;padding:6px;}
  .pill button,.solo{position:relative;flex:1;height:52px;border-radius:999px;display:flex;align-items:center;justify-content:center;}
  .pill button.active{background:rgba(255,255,255,.1);}
  .pill svg,.solo svg{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .pill button.active svg{stroke:var(--text);}
  .solo{flex:none;width:64px;height:64px;background:#1c1c20;}
  .badge{position:absolute;top:8px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;
    background:var(--accent);color:#140a05;font-size:11px;font-weight:800;display:none;align-items:center;justify-content:center;}
  .badge.show{display:flex;}
</style>
</head>

// Если фото нет — показывается рисунок.
const PHOTO_EXTS = ["jpg", "png", "webp"];
const PHOTOS = {};
let photoRenderQueued = false;
function tryPhoto(id, i){
  if(i >= PHOTO_EXTS.length){ PHOTOS[id] = false; return; }
  const im = new Image();
  im.onload = () => {
    PHOTOS[id] = im.src;
    if(!photoRenderQueued){
      photoRenderQueued = true;
      requestAnimationFrame(() => { photoRenderQueued = false; if(state.view === "catalog") render(); });
    }
  };
  im.onerror = () => tryPhoto(id, i + 1);
  im.src = `img/${id}.${PHOTO_EXTS[i]}`;
}
const TIRE_INDEX = {};
TIRES.forEach(br => br.m.forEach(m => m.z.forEach(z => {
  const [size, rim, c, stud, id] = z;
  const name = `${br.b} ${m.n} ${size} R${rim}${c?"C":""}${stud?" шип":""}`;
  TIRE_INDEX[id] = { br, m, z };
  ITEM_INDEX[id] = { id, icon:"wheel", name, color:"#4cc38a", desc:"" };
})));
const TOLAT_MAP = {"А":"A","В":"B","Е":"E","К":"K","М":"M","Н":"H","О":"O","Р":"P","С":"C","Т":"T","Х":"X","У":"Y"};
const normT = s => s.toUpperCase().split("").map(ch => TOLAT_MAP[ch] || ch).join("").replace(/[\s\-]/g, "");
function tireMatch(br, m, z, q){
  if(state.tSeason !== "all" && !m.s.includes(state.tSeason)) return false;
  if(state.tRim !== "all" && z[1] !== state.tRim) return false;
  if(!q) return true;
  const qd = q.replace(/[^0-9]/g, "");
  if(/^R?\d/.test(q) && /^[R0-9\/.,]+$/.test(q)){            // размер: 205/55R16, 2055516, R16
    if(q.startsWith("R")) return ("R" + z[1]).startsWith(q.replace(",", "."));
    const zd = (z[0] + z[1]).replace(/[^0-9]/g, "");
    return zd.startsWith(qd);
  }
  return normT(br.b + " " + m.n).includes(q);
}

// История заявок приходит от бота в параметре ?h=... (base64url JSON: [[номер,"ГГГГ-ММ-ДД","n|d|c","id1,id2"], ...])
function readHistory(){
  try{
    const h = new URLSearchParams(location.search).get("h");
    if(!h) return [];
    let b = h.replace(/-/g,"+").replace(/_/g,"/"); while(b.length % 4) b += "=";
    const bytes = Uint8Array.from(atob(b), ch => ch.charCodeAt(0));
    const arr = JSON.parse(new TextDecoder().decode(bytes));
    return arr.map(r => ({ num:r[0], date:new Date(r[1]+"T12:00:00"), status:r[2], ids:(r[3]||"").split(",").filter(Boolean) }));
  }catch(e){ return []; }
}

function plural(n, one, few, many){
  const m10=n%10, m100=n%100;
  if(m10===1 && m100!==11) return one;
  if(m10>=2 && m10<=4 && (m100<10||m100>=20)) return few;
  return many;
}

function tireGridHTML(){
  const q = normT(state.tq || "");

/* ---------- VIN ---------- */
const LOOKALIKE = {"А":"A","В":"B","Е":"E","К":"K","М":"M","Н":"H","Р":"P","С":"C","Т":"T","Х":"X","У":"Y"};
function normVin(s){
  return s.toUpperCase().split("").map(ch => LOOKALIKE[ch] || ch).join("").replace(/[^A-Z0-9]/g, "").slice(0, 17);
}
function vinCheck(v){
  if(!v) return { ok:false, err:"" };
  if(/[IOQ]/.test(v)) return { ok:false, err:"В VIN не бывает букв I, O, Q — скорее всего, это цифры 1 и 0." };
  if(v.length < 17) return { ok:false, err:"" };
  return { ok:/^[A-HJ-NPR-Z0-9]{17}$/.test(v), err:"" };
}

      • на стойке водительской двери
    </div>
  </div>

function updateVinUI(){
  const inp = document.getElementById("vinInput");

function sendVin(){
  const vin = state.vin, part = state.part.trim();
  if(!vinCheck(vin).ok || part.length < 2) return;
  if(tg && tg.sendData && tg.initData !== undefined){
    tg.sendData(JSON.stringify({ type:"vin", vin, part }));
    tg.close();
  } else {
    alert("Откройте форму через кнопку «⚙️ Поиск по VIN» в боте, чтобы отправить запрос:\n\nVIN: " + vin + "\nДеталь: " + part);
  }
}

  if(!m) return null;
  return `${m[1]}${m[2] ? "/" + m[2] : ""} R${m[3]}${m[4] ? "C" : ""}`;
}

function openSheet(kind, id){

}
function closeSheet(){
  const wasBrand = state.sheet && state.sheet.kind === "brand";

/* ---------- render ---------- */
function render(){
  const v = state.view;
  document.getElementById("view").innerHTML =
    v === "catalog" ? catalogHTML() : v === "history" ? historyHTML() : v === "vin" ? vinHTML() : v === "tirereq" ? tireReqHTML() : infoHTML();
  if(v === "vin") updateVinUI();
  if(v === "tirereq") updateTireReqUI();
  document.querySelectorAll(".pill button").forEach(b => b.classList.toggle("active", b.dataset.view === v));
  const n = state.selected.size;
  const badge = document.getElementById("badge"); badge.textContent = n; badge.classList.toggle("show", n > 0);
  document.getElementById("cartcount").textContent = n + " " + plural(n,"позиция","позиции","позиций");
  document.getElementById("cartbar").classList.toggle("show", n > 0 && v === "catalog");
  if(state.sheet && state.sheet.kind === "cart") document.getElementById("sheet").innerHTML = cartSheet();
  if(state.sheet && state.sheet.kind === "brand"){
    const sh = document.getElementById("sheet"), top = sh.scrollTop;
    sh.innerHTML = brandSheet(state.sheet.id); sh.scrollTop = top;
  }
}
function bump(id){
  requestAnimationFrame(() => {
    document.querySelectorAll(`[data-toggle="${id}"]`).forEach(el => el.classList.add("pop"));
    ["badge","heroCount"].forEach(x => { const el = document.getElementById(x); if(el){ el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); } });
  });
}
function toggle(id){
  if(state.selected.has(id)) state.selected.delete(id); else state.selected.add(id);
  haptic(); render(); bump(id);
}
function toggleBundle(key){
  const [catId, k] = key.split(":");
  const bd = CATEGORIES.find(c => c.id === catId).bundles[+k];
  const all = bd.ids.every(id => state.selected.has(id));
  bd.ids.forEach(id => all ? state.selected.delete(id) : state.selected.add(id));
  haptic(); render(); bd.ids.forEach(bump);
}
function sendRequest(){
  if(!state.selected.size) return;
  const items = [...state.selected].map(id => ({ id, name:ITEM_INDEX[id].name }));
  if(tg && tg.sendData && tg.initData !== undefined){
    tg.sendData(JSON.stringify({ items }));
    tg.close();
  } else {
    alert("Откройте каталог через кнопку «🛍 Каталог» в боте, чтобы отправить заявку:\n\n" + items.map(i => "• " + i.name).join("\n"));
  }
}

document.addEventListener("click", e => {
  const t = e.target;
  const tog = t.closest("[data-toggle]");
  if(tog){ e.stopPropagation(); toggle(tog.dataset.toggle); return; }
  const st = t.closest("[data-sheet-toggle]");
  if(st){ toggle(st.dataset.sheetToggle); closeSheet(); return; }
  if(t.closest("[data-tireask]")){ e.stopPropagation(); openTireReq(); return; }
  const trs = t.closest("[data-trseason]");
  if(trs){ state.tr.season = trs.dataset.trseason; haptic(); render(); return; }
  const trq = t.closest("[data-trqty]");
  if(trq){ state.tr.qty = Math.min(20, Math.max(1, state.tr.qty + +trq.dataset.trqty)); haptic(); render(); return; }
  if(t.closest("#trSend")){ sendTireReq(); return; }
  const ts = t.closest("[data-tseason]");
  if(ts){ state.tSeason = ts.dataset.tseason; state.tAll = false; haptic(); render(); return; }
  const tr = t.closest("[data-trim]");
  if(tr){ state.tRim = tr.dataset.trim; state.tAll = false; haptic(); render(); return; }
  if(t.closest("[data-tall]")){ state.tAll = true; render(); return; }
  const bt = t.closest("[data-brand]");
  if(bt){ openSheet("brand", +bt.dataset.brand); return; }
  if(t.closest("[data-closesheet]")){ closeSheet(); return; }
  const bb = t.closest("[data-bundle]");
  if(bb){ e.stopPropagation(); toggleBundle(bb.dataset.bundle); return; }
  if(t.closest("#sendBtn")){ sendRequest(); return; }
  if(t.closest("#vinSend")){ sendVin(); return; }
  const q = t.closest("[data-quick]");
  if(q){ const ta = document.getElementById("partInput");
    state.part = state.part.trim() ? state.part.trim() + ", " + q.dataset.quick.toLowerCase() : q.dataset.quick;
    ta.value = state.part; haptic(); updateVinUI(); return; }
  if(t.closest("[data-vinhelp]")){ state.vinHelp = !state.vinHelp; document.getElementById("helpBox").classList.toggle("show", state.vinHelp); return; }
  if(t.closest("[data-cart]") || t.closest("#cartbar")){ openSheet("cart"); return; }
  const chip = t.closest("[data-cat]");
  if(chip){ state.cat = chip.dataset.cat; haptic(); render(); return; }
  const nav = t.closest("[data-view]");
  if(nav){ state.view = nav.dataset.view; closeSheet(); render(); window.scrollTo(0,0); return; }
  const open = t.closest("[data-open]");
  if(open){ openSheet("item", open.dataset.open); return; }
  if(t.id === "shade"){ closeSheet(); return; }
  if(t.closest("#supportBtn")){
    const url = "https://t.me/GarageSupport";
    if(tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, "_blank");
  }
});

document.addEventListener("input", e => {

  if(e.target.id === "tq"){ state.tq = e.target.value.trim(); document.getElementById("tireGrid").innerHTML = tireGridHTML(); }
});

if(tg){ tg.ready(); tg.expand(); try{ const bg = getComputedStyle(document.body).getPropertyValue("--bg").trim(); tg.setHeaderColor(bg); tg.setBackgroundColor(bg); }catch(e){} }
render();
Object.keys(ITEM_INDEX).forEach(id => tryPhoto(id, 0));

// заставка с воротами — один раз за сессию и только при открытии каталога
(function(){
  const intro = document.getElementById("intro");
  let seen = false;
  try{ seen = sessionStorage.getItem("garageIntro") === "1"; sessionStorage.setItem("garageIntro","1"); }catch(e){}
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(seen || reduce || START_VIEW !== "catalog"){ intro.remove(); return; }
  document.getElementById("introLogo").src = LOGO;
  setTimeout(() => intro.classList.add("up"), 650);
  setTimeout(() => intro.remove(), 1600);
})();
</script>
